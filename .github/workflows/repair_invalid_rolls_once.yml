name: One-shot exact manifest roll repair

on:
  push:
    paths:
      - '.github/workflows/repair_invalid_rolls_once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate every wishlist roll against current Bungie manifest
        shell: python
        run: |
          import json, re, sqlite3, urllib.request, zipfile, io
          from collections import defaultdict, Counter
          from pathlib import Path

          ROOT = Path("aegis_endgame_pve_dim_wishlist.txt")
          src = ROOT.read_text(encoding="utf-8")
          line_re = re.compile(r"^dimwishlist:item=(\d+)&perks=([0-9,]+)(.*)$")

          # Download the current official Bungie manifest database.
          with urllib.request.urlopen("https://www.bungie.net/Platform/Destiny2/Manifest/", timeout=60) as r:
              manifest_meta = json.load(r)
          path = manifest_meta["Response"]["mobileWorldContentPaths"]["en"]
          url = "https://www.bungie.net" + path
          with urllib.request.urlopen(url, timeout=180) as r:
              raw = r.read()

          # Bungie serves the world DB as either a zip payload or SQLite directly.
          if raw[:2] == b"PK":
              z = zipfile.ZipFile(io.BytesIO(raw))
              db_bytes = z.read(z.namelist()[0])
          else:
              db_bytes = raw
          db_path = Path("world.sqlite")
          db_path.write_bytes(db_bytes)

          con = sqlite3.connect(db_path)
          cur = con.cursor()

          def fetch_def(table, h):
              row = cur.execute(f'SELECT json FROM "{table}" WHERE id=?', (int(h),)).fetchone()
              if not row:
                  # unsigned -> signed 32-bit fallback used by some manifest tables
                  signed = int(h) if int(h) < 2**31 else int(h) - 2**32
                  row = cur.execute(f'SELECT json FROM "{table}" WHERE id=?', (signed,)).fetchone()
              return json.loads(row[0]) if row else None

          item_cache = {}
          plugset_cache = {}

          def item_def(h):
              if h not in item_cache:
                  item_cache[h] = fetch_def("DestinyInventoryItemDefinition", h)
              return item_cache[h]

          def plugset_def(h):
              if h not in plugset_cache:
                  plugset_cache[h] = fetch_def("DestinyPlugSetDefinition", h)
              return plugset_cache[h]

          def allowed_plugs(item_hash):
              d = item_def(item_hash)
              if not d:
                  return None
              allowed = set()
              sockets = (d.get("sockets") or {}).get("socketEntries") or []
              for s in sockets:
                  initial = s.get("singleInitialItemHash")
                  if initial:
                      allowed.add(int(initial))
                  for p in s.get("reusablePlugItems") or []:
                      ph = p.get("plugItemHash")
                      if ph:
                          allowed.add(int(ph))
                  for key in ("randomizedPlugSetHash", "reusablePlugSetHash"):
                      ps = s.get(key)
                      if ps:
                          pd = plugset_def(ps)
                          if pd:
                              for p in pd.get("reusablePlugItems") or []:
                                  ph = p.get("plugItemHash")
                                  if ph:
                                      allowed.add(int(ph))
              return allowed

          # Establish weapon-name coverage BEFORE mutation.
          before_hashes = []
          for line in src.splitlines():
              m = line_re.match(line)
              if m:
                  before_hashes.append(int(m.group(1)))
          before_names = {}
          missing_defs = set()
          for h in sorted(set(before_hashes)):
              d = item_def(h)
              if not d:
                  missing_defs.add(h)
              else:
                  before_names[h] = ((d.get("displayProperties") or {}).get("name") or f"HASH:{h}")
          if missing_defs:
              raise SystemExit(f"Cannot validate hashes absent from current manifest: {sorted(missing_defs)}")

          before_weapon_names = set(before_names.values())

          kept = []
          invalid = []
          kept_hashes = Counter()
          invalid_by_hash = Counter()
          invalid_perks = Counter()

          for line in src.splitlines():
              m = line_re.match(line)
              if not m:
                  kept.append(line)
                  continue
              h = int(m.group(1))
              perks = [int(x) for x in m.group(2).split(",") if x]
              allowed = allowed_plugs(h)
              bad = [p for p in perks if p not in allowed]
              if bad:
                  invalid.append((h, tuple(perks), tuple(bad)))
                  invalid_by_hash[h] += 1
                  invalid_perks.update(bad)
                  continue
              kept.append(line)
              kept_hashes[h] += 1

          # Determine coverage AFTER filtering.
          after_weapon_names = {before_names[h] for h in kept_hashes}
          vanished_names = sorted(before_weapon_names - after_weapon_names)

          print(f"Rolls before: {len(before_hashes):,}")
          print(f"Invalid roll lines removed: {len(invalid):,}")
          print(f"Rolls after: {sum(kept_hashes.values()):,}")
          print(f"Unique Aegis weapon names before: {len(before_weapon_names):,}")
          print(f"Unique Aegis weapon names after:  {len(after_weapon_names):,}")
          print("Top invalid perk hashes:", invalid_perks.most_common(30))
          print("Affected item hashes:", invalid_by_hash.most_common())

          # User requirement: do NOT remove any weapon from the wishlist.
          if vanished_names:
              print("WOULD REMOVE WEAPON NAMES:", vanished_names)
              raise SystemExit("Repair aborted: at least one weapon name would disappear.")

          # Coverage must be exactly unchanged. The workbook contains repeated
          # weapon names/versions, so unique-name count is not the same as row count.
          if after_weapon_names != before_weapon_names:
              raise SystemExit(
                  f"Aegis weapon-name coverage changed: before={len(before_weapon_names)} after={len(after_weapon_names)}"
              )

          # Explicit regression guard from the user's screenshot.
          bad_honing = [x for x in invalid if 1089671869 in x[2]]
          print(f"Elemental Honing (1089671869) invalid-line hits removed: {len(bad_honing)}")

          # Final full revalidation of every kept wishlist line.
          final_text = "\n".join(kept).rstrip() + "\n"
          final_rolls = 0
          for line in final_text.splitlines():
              m = line_re.match(line)
              if not m:
                  continue
              final_rolls += 1
              h = int(m.group(1))
              perks = [int(x) for x in m.group(2).split(",") if x]
              allowed = allowed_plugs(h)
              bad = [p for p in perks if p not in allowed]
              if bad:
                  raise SystemExit(f"Post-repair validation failed: item {h}, invalid perks {bad}")

          ROOT.write_text(final_text, encoding="utf-8")
          Path("manifest_validation_report.txt").write_text(
              "\n".join([
                  f"Rolls before: {len(before_hashes)}",
                  f"Invalid roll lines removed: {len(invalid)}",
                  f"Rolls after: {final_rolls}",
                  f"Weapon names before: {len(before_weapon_names)}",
                  f"Weapon names after: {len(after_weapon_names)}",
                  f"Elemental Honing invalid-line hits removed: {len(bad_honing)}",
                  "",
                  "Affected item hashes:",
                  *[f"{h}: {n} invalid lines removed | {before_names.get(h, 'UNKNOWN')}" for h,n in invalid_by_hash.most_common()],
                  "",
                  "Invalid perk hashes:",
                  *[f"{p}: {n}" for p,n in invalid_perks.most_common()],
              ]) + "\n",
              encoding="utf-8"
          )

      - name: Commit repaired wishlist and validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aegis_endgame_pve_dim_wishlist.txt manifest_validation_report.txt
          git rm .github/workflows/repair_invalid_rolls_once.yml
          git commit -m "Remove invalid exact-hash perk entries without dropping Aegis weapons"
          git push
