name: One-shot exact-hash restore

on:
  push:
    paths:
      - '.github/workflows/restore_exact_hashes_once.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge exact-hash-safe blocks
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("aegis_endgame_pve_dim_wishlist.txt")
          text = root.read_text(encoding="utf-8")
          targets = {
              "621450049":255,
              "2987244302":255,
              "3229982889":255,
              "468276817":15,
              "2213885190":127,
              "924095500":511,
              "837298567":511,
              "3922217119":511,
          }

          # Keep the current manifest-validated file as the base. Remove only
          # target item lines so this repair is idempotent; never touch 3360937899.
          kept = []
          for line in text.splitlines():
              m = re.match(r"dimwishlist:item=(\\d+)&perks=", line)
              if m and m.group(1) in targets:
                  continue
              kept.append(line)

          base = "\n".join(kept).rstrip() + "\n"
          parts = [base, "\n// === Exact-hash-safe restoration 11/25/2026 ===\n"]
          for h, expected in targets.items():
              p = Path(f".github/restore_{h}.txt")
              block = p.read_text(encoding="utf-8").strip()
              got = sum(1 for x in block.splitlines() if x.startswith(f"dimwishlist:item={h}&perks="))
              if got != expected:
                  raise SystemExit(f"{h}: expected {expected} rows, got {got}")
              wrong = [x for x in block.splitlines() if x.startswith("dimwishlist:item=") and not x.startswith(f"dimwishlist:item={h}&perks=")]
              if wrong:
                  raise SystemExit(f"{h}: cross-hash contamination detected")
              parts.append(f"\n// Exact hash {h}\n{block}\n")

          merged = "".join(parts)
          # Hard validation of final exact-hash counts.
          for h, expected in targets.items():
              got = len(re.findall(rf"^dimwishlist:item={h}&perks=", merged, flags=re.M))
              if got != expected:
                  raise SystemExit(f"final {h}: expected {expected}, got {got}")

          # Existing exact-hash-safe Unvoiced variant must remain unchanged.
          if len(re.findall(r"^dimwishlist:item=3360937899&perks=", merged, flags=re.M)) != 127:
              raise SystemExit("Unvoiced 3360937899 count changed")

          total = len(re.findall(r"^dimwishlist:item=", merged, flags=re.M))
          if total != 199511:
              raise SystemExit(f"unexpected final roll count: {total}")

          root.write_text(merged, encoding="utf-8")
          print("Validated final roll count:", total)
      - name: Commit repaired wishlist and remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aegis_endgame_pve_dim_wishlist.txt
          git rm .github/restore_*.txt .github/workflows/restore_exact_hashes_once.yml
          git commit -m "Restore missing weapons with exact-hash-safe perk entries"
          git push
