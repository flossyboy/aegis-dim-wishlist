name: Fix Lotus-Eater non-enhanced Volatile Launch

on:
  push:
    paths:
      - '.github/workflows/fix_lotus_volatile_once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace enhanced Volatile Launch hash on Lotus-Eater only
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("aegis_endgame_pve_dim_wishlist.txt")
          txt=p.read_text()
          lotus={3922217119,924095500,837298567}
          old=373417387
          new=1478423395
          out=[]
          changed=0
          for line in txt.splitlines():
              m=re.match(r"^(dimwishlist:item=(\d+)&perks=)([0-9,]+)(.*)$",line)
              if not m:
                  out.append(line); continue
              h=int(m.group(2))
              perks=[int(x) for x in m.group(3).split(",") if x]
              if h in lotus and old in perks:
                  perks=[new if x==old else x for x in perks]
                  # dedupe while preserving order
                  seen=set(); perks=[x for x in perks if not (x in seen or seen.add(x))]
                  line=m.group(1)+",".join(map(str,perks))+m.group(4)
                  changed+=1
              out.append(line)
          final="\n".join(out).rstrip()+"\n"
          # hard guards
          if changed==0:
              raise SystemExit("No Lotus-Eater Volatile Launch entries changed")
          for h in lotus:
              lines=[x for x in final.splitlines() if x.startswith(f"dimwishlist:item={h}&perks=")]
              if not lines:
                  raise SystemExit(f"Lotus-Eater hash {h} disappeared")
              if any(f",{old}," in f",{x.split('&perks=',1)[1].split('#',1)[0]}," for x in lines):
                  raise SystemExit(f"Old Volatile Launch hash remains on {h}")
              if not any(f",{new}," in f",{x.split('&perks=',1)[1].split('#',1)[0]}," for x in lines):
                  raise SystemExit(f"New Volatile Launch hash missing on {h}")
          p.write_text(final)
          print("changed_lines",changed)
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aegis_endgame_pve_dim_wishlist.txt
          git rm .github/workflows/fix_lotus_volatile_once.yml
          git commit -m "Use non-enhanced Volatile Launch hash for Lotus-Eater"
          git push
